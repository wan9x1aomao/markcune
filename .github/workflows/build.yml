name: Windows 与 Linux

# 发版专用：由 scripts/release.sh 触发（gh workflow run），或在 Actions 页面手动跑。
on:
  workflow_dispatch:

# 默认只读。需要写 Release 的 job 自己声明，别的 job 拿不到写权限。
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 所有第三方 Action 都固定到 commit SHA：上游把 tag 移到别处、或仓库被投毒，
      # 这里跑的仍然是当初审过的那一份代码。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 草稿版本
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 已经发布出去的版本不许被重跑覆盖：产物不一样，用户签名校验也会对不上。
          # 没提升版本号就重跑发版，是这里唯一能拦的地方。
          EXISTING=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$EXISTING" = "false" ]; then
            echo "::error::v$VERSION 已经是正式发布版，拒绝用新产物覆盖。请先在 tauri.conf.json 提升版本号。"
            exit 1
          fi
          if [ "$EXISTING" = "missing" ]; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "MarkCune $VERSION" --notes "构建产物，由 scripts/release.sh 收集后发布到官网。"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    # 这个 job 持有更新签名私钥，所以只给读权限、也不碰 Release：
    # 私钥和「能写仓库的令牌」不同时出现在同一台机器上，投毒也只能拿到其中一个。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux 依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb libasound2-dev

      # 固定到 SHA 时 action 读不到分支名，必须显式说明要哪条工具链。
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target.noindex

      - run: npm ci

      - name: 单元测试
        run: npm test

      - name: 冒烟测试（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npx tauri build --debug --no-bundle
          ./tests/smoke/run.ps1

      - name: 冒烟测试（Linux）
        if: matrix.platform == 'linux'
        run: |
          npx tauri build --debug --no-bundle
          xvfb-run -a tests/smoke/run.sh

      - name: 打包
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          source scripts/release.conf
          export MDPAD_UPDATE_ENDPOINT="$UPDATE_ENDPOINT"
          # 「一键整理」的网关地址，和 macOS 本机打包取自同一个 release.conf。
          # 留空则不注入，这一版的 Windows / Linux 包只做规则整理。
          if [ -n "${TIDY_URL:-}" ]; then export MDPAD_TIDY_URL="$TIDY_URL"; fi
          echo "整理服务：${MDPAD_TIDY_URL:-未配置，只做规则整理}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CONFIG='{"bundle":{"createUpdaterArtifacts":true}}'
          BUNDLE=src-tauri/target.noindex/release/bundle
          mkdir -p out
          if [ "${{ matrix.platform }}" = windows ]; then
            npx tauri build --bundles nsis --config "$CONFIG"
            cp $BUNDLE/nsis/*-setup.exe "out/MarkCune-$VERSION-windows-x64-setup.exe"
            cp $BUNDLE/nsis/*-setup.exe.sig "out/MarkCune-$VERSION-windows-x64-setup.exe.sig"
          else
            npx tauri build --bundles appimage,deb --config "$CONFIG"
            cp $BUNDLE/appimage/*.AppImage "out/MarkCune-$VERSION-linux-x86_64.AppImage"
            cp $BUNDLE/appimage/*.AppImage.sig "out/MarkCune-$VERSION-linux-x86_64.AppImage.sig"
            cp $BUNDLE/deb/*.deb "out/MarkCune-$VERSION-linux-amd64.deb"
          fi
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  # 最后这一步才碰仓库，而且它没有任何构建步骤、也拿不到签名私钥。
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: 上传到草稿版本
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -la out
          gh release upload "v$VERSION" out/* --clobber
