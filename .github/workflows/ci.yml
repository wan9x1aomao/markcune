name: CI

# 每个 PR 和每次推 main 都跑一遍三平台的单测。
# 冒烟测试（tests/smoke）不放在这里：它会真的去 GitHub 下载一个仓库，容易受网络和限流影响，
# 只由 .github/workflows/build.yml 在发版时跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（${{ matrix.platform }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # 第三方 Action 一律固定到 commit SHA，别让上游的 tag 决定这里跑什么。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux 依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                                  librsvg2-dev libxdo-dev libssl-dev patchelf libasound2-dev

      # 固定到 SHA 时 action 读不到分支名，必须显式说明要哪条工具链。
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target.noindex

      - run: npm ci

      - name: 前端单测
        run: npm test

      - name: 前端构建
        if: matrix.platform == 'linux'
        run: npm run build:web

      - name: Rust 单测
        working-directory: src-tauri
        run: cargo test
