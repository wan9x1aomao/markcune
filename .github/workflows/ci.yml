name: CI

# 每个 PR 和每次推 main 都跑一遍三平台的单测；界面测试单独一条 Linux job（见文件末尾）。
# 冒烟测试（tests/smoke）不放在这里：它会真的去 GitHub 下载一个仓库，容易受网络和限流影响，
# 只由 .github/workflows/build.yml 在发版时跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（${{ matrix.platform }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # 第三方 Action 一律固定到 commit SHA，别让上游的 tag 决定这里跑什么。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux 依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                                  librsvg2-dev libxdo-dev libssl-dev patchelf libasound2-dev

      # 固定到 SHA 时 action 读不到分支名，必须显式说明要哪条工具链。
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target.noindex

      - run: npm ci

      - name: 前端单测
        run: npm test

      - name: 前端构建
        if: matrix.platform == 'linux'
        run: npm run build:web

      - name: Rust 单测
        working-directory: src-tauri
        run: cargo test

  # 真编辑器 + 无头 Chrome，外壳的回答是写死的：不填 Key、不联网也能跑。
  # Chrome 和 Windows 的 WebView2 同属 Chromium，「从左边距拖选」「表格列宽」这类
  # 只在 Chromium 下出现的回归，在这条线上就能挡住，不用等发版才暴露。
  # 只挂 Linux：三个平台跑的是同一个 Chromium 引擎，多开两倍机器不会多挡住什么；
  # WebView2 真机检查仍由 preview.yml 手动触发（那条要打调试包、跑真实 WebView2）。
  browser:
    name: 界面测试（Chrome）
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # 第三方 Action 一律固定到 commit SHA，别让上游的 tag 决定这里跑什么。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 先确认 Chrome 在，缺了就在这一步报清楚，别让后面的用例报成「页面起不来」。
      - name: Chrome 就位
        run: google-chrome --version || chromium --version || chromium-browser --version

      - name: 界面与 AI 逐项测试
        run: npm run test:browser
