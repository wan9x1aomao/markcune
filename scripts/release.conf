# 发布配置，由 scripts/release.sh 读取。
#
# 注意：下面地址、目录与私钥路径里的 mdpad 都是过渡期沿用的旧标识（见 docs/rebrand-markcune.md
# 第 4 节例外清单）。3.5.x 客户端只认旧地址，改名更不能改这里，否则已安装的版本收不到更新。

# 4.0.0 更名版按「手动升级」发布（2026-10-27 定）：
#   1 = 不发自动更新。release.sh 照常收集三端产物、生成 release/<版本>/latest.json，
#       但不碰 SITE_DIR、不覆盖旧站 latest.json —— 旧站继续停在 3.5.6，3.5.6 客户端不会弹更新。
#   新官网就绪、downloads 与 latest.json 都放到新站之后，把这里改回 0。
MANUAL_UPGRADE=1

# latest.json 的公开地址。会写进应用里，之后不要再改，否则已安装的版本找不到更新。
# 4.0.0 打包前若新站已经就绪，把下面两行换成新站地址（旧站永远不再更新，老客户端自然停在 3.5.6）；
# 若新站还没就绪，就继续用旧地址 —— 那么 4.0.0 自己也只能手动升级到下一版，等下一版再把端点换到新站。
UPDATE_ENDPOINT="https://mdpad.app.workbuddy.host/latest.json"
# 存放更新包和安装包的目录地址。
DOWNLOAD_BASE_URL="https://mdpad.app.workbuddy.host/downloads"
# 官网的本地目录（用 WorkBuddy 发布）。填了就会把文件放进去并更新页面上的版本号；不需要就留空。
SITE_DIR="$HOME/mdpad-site"

# 签名私钥（务必备份；丢失后已安装的应用将无法再更新）
SIGNING_KEY_FILE="$HOME/.tauri/mdpad.key"

# 「一键整理」的 AI 网关地址（见 docs/tidy-gateway.md 与 gateway/README.md）。留空则只做规则整理。
# 三个平台共用这一处：macOS 在本机打包时读它，GitHub Actions 上的 Windows / Linux 打包时也读它。
# 一旦写进正式包就不要再改地址，否则已安装的应用会永久失去这个功能。
TIDY_URL=""
