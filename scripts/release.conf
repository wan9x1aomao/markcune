# 发布配置，由 scripts/release.sh 读取。
#
# 私钥路径里的 mdpad 是过渡期沿用的旧标识（见 docs/rebrand-markcune.md 第 4 节）。
# 更新地址从 4.0.6 这一批安装包起写死为下面的 GitHub Release 地址，之后不要再改，
# 否则已经装上 4.0.6 的客户端会找不到更新。4.0.5 及更早的包仍是旧官网地址，改这里影响不到它们。

# 0 = 正常发布：把固定文件名和 latest.json 上传到 GitHub Release 草稿。
#   1 = 手动升级：照常打包并上传安装包，但不上传 latest.json，也不写 SITE_DIR。
MANUAL_UPGRADE=0

# latest.json 的公开地址。会写进应用里，之后不要再改，否则已安装的版本找不到更新。
#
# 2026-11-12：workbuddy.host 的分享链接开始要求 sharecode，裸地址一律 403，已安装客户端读不到清单。
# 更新清单与安装包因此迁到 GitHub Release 的固定地址：releases/latest/download/ 始终指向最新正式
# Release，每版覆盖同名资产即可，地址不用再变。
# 端点只影响新构建的版本；仍在读旧地址的客户端，需要一个过渡版本引导手动安装一次。
UPDATE_ENDPOINT="https://github.com/wan9x1aomao/markcune/releases/latest/download/latest.json"
# 存放更新包和安装包的目录地址。
DOWNLOAD_BASE_URL="https://github.com/wan9x1aomao/markcune/releases/latest/download"
# 可选的本地站点目录。留空（默认）则不写任何站点文件：安装包和 latest.json 只进 GitHub Release。
# 旧的 WorkBuddy 目录（$HOME/mdpad-site）不再是默认目标，那个分享链接已经 403。
# 如果还要同步一份本地站点，把目录填回来。脚本会按固定文件名写入 downloads/ 与 latest.json。
# 建议这个目录本身是一个 git 仓库，方便回滚；downloads/ 里的安装包不要提交。
SITE_DIR=""

# 签名私钥（务必备份；丢失后已安装的应用将无法再更新）
SIGNING_KEY_FILE="$HOME/.tauri/mdpad.key"

# 「一键整理」的 AI 网关地址（见 docs/tidy-gateway.md 与 gateway/README.md）。留空则只做规则整理。
# 三个平台共用这一处：macOS 在本机打包时读它，GitHub Actions 上的 Windows / Linux 打包时也读它。
# 一旦写进正式包就不要再改地址，否则已安装的应用会永久失去这个功能。
TIDY_URL=""
