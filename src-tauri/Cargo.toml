[package]
name = "mdpad"
version = "4.0.4"
description = "本地 Markdown 所见即所得编辑器"
authors = ["wan9x1aomao"]
license = "MIT"
repository = "https://github.com/wan9x1aomao/markcune"
homepage = "https://mdpad.app.workbuddy.host"
# 这是个应用而不是库，避免误发到 crates.io。
publish = false
edition = "2021"

# Android loads a cdylib. The desktop binary stays `mdpad` and calls the same `run()`.
[lib]
name = "mdpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mdpad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
base64 = "0.22"
# 只解压 deflate（GitHub 的 zip 用的就是它）。默认 feature 会拖进 zstd / lzma / bzip2，编译很重且用不上。
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# ⚠️ flate2 的后端必须由我们自己点名。zip 的 `deflate-flate2` 只声明"用 flate2 解压"，
# 并不选压缩后端；后端若不选，flate2 直接 compile_error 拒绝编译（"You need to choose a
# zlib backend"）。在 macOS 上它碰巧能过 —— 别的依赖开了 flate2/rust_backend，feature 被
# 顺带合并进来了；Windows 上那条路径不存在，于是 CI 编译失败。这种"靠别人顺手开"的写法
# 在跨平台上不成立。rust_backend 是纯 Rust 的 miniz_oxide，不需要 C 编译器，三平台一致。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# 录音：三平台各走系统的音频 API（macOS CoreAudio / Windows WASAPI / Linux ALSA）。
# ⚠️ Linux 后端链接 libasound，CI 和本地 Linux 构建都必须先装 libasound2-dev，否则编译直接失败。
# ⚠️ webview 里拿不到麦克风（wry 没实现 WKUIDelegate 的 media capture 回调），所以录音只能在 Rust 侧做。
cpal = "0.15"

# Desktop keeps the aws-lc rustls provider (`rustls` feature). Android uses
# `rustls-no-provider` plus ring: aws-lc-sys does not cross-compile reliably
# for Android, and the updater plugin already vendors ring.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "multipart"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-root-certs = "1.0.9"

[target.'cfg(windows)'.dependencies]
# std::os::windows::fs::MetadataExt::file_index is still unstable (windows_by_handle).
# The Win32 call is the stable way to read the volume serial and file index.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

# The plugin crate is empty on Android/iOS (`#![cfg(not(mobile))]`). macOS never used it.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
